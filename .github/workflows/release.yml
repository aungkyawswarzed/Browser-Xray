name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: helper/go.sum

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $value = $env:GITHUB_REF_NAME -replace "^[vV]", ""
          } else {
            $value = "${{ inputs.version }}"
          }
          if ($value -match "^\d+\.\d+$") {
            $value = "$value.0"
          }
          if ($value -notmatch "^\d+\.\d+\.\d+$") {
            throw "Invalid release version: $value"
          }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: pwsh
        run: .\scripts\release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Test helper integration
        shell: pwsh
        run: node scripts/test-helper.mjs

      - name: Test local VLESS data path
        shell: pwsh
        run: node scripts/test-e2e.mjs

      - name: Test installer cleanup
        shell: pwsh
        run: .\scripts\test-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrowserXray-${{ steps.version.outputs.value }}
          path: |
            release/BrowserXray-*-win64.zip
            release/BrowserXray-Setup-*-win64.exe
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json url 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; preserving its published assets."
            exit 0
          }
          $assets = @(
            (Get-ChildItem release -Filter "BrowserXray-*-win64.zip").FullName
            (Get-ChildItem release -Filter "BrowserXray-Setup-*-win64.exe").FullName
            (Join-Path $PWD "release\SHA256SUMS.txt")
            (Join-Path $PWD "release\RELEASE_NOTES.md")
          )
          gh release create $tag @assets --title "Browser Xray $tag" --notes-file release/RELEASE_NOTES.md
